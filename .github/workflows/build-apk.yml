name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect active Java version" >&2
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, but version 17 or newer is required" >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt!" >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK $EXPECTED_APK not found!" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files in app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ] || [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: Verification failed for $EXPECTED_APK" >&2
            exit 1
          fi
          echo "Successfully verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F '/' '{print $2}' | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          RUN_NUM="${{ github.run_number }}"
          RELEASE_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$RELEASE_DIR"
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          RELEASE_PATH="${RELEASE_DIR}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_PATH"
          echo "asset_path=${RELEASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${RELEASE_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset validation failed for $ASSET_PATH" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > /tmp/release_notes.md
          ### Automated Debug Build
          - **Source:** Automatically generated debug APK built by GitHub Actions.
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Purpose:** Intended for testing and internal verification.
          - **Notice:** This APK is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          REPO="${{ github.repository }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================="
            echo "GitHub Release Succeeded!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "=========================================="
            gh release view "$RELEASE_TAG" || true

            echo "### 🚀 Debug APK GitHub Release Published" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Filename:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK can be downloaded directly on your phone from the **Assets** section of the release above." >> "$GITHUB_STEP_SUMMARY"
            echo "The standard GitHub Actions workflow artifact \`app-debug-apk\` is also preserved as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK build completed successfully."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Build Succeeded (Release Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK build succeeded and the artifact **\`app-debug-apk\`** was uploaded successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release creation encountered an issue, but your build artifact is safe and downloadable from the GitHub Actions run Summary page." >> "$GITHUB_STEP_SUMMARY"
          fi
